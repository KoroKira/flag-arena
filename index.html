<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><title>Flag Arena 196</title><link rel="manifest" href="manifest.webmanifest"><style>body{font:16px system-ui;background:#101827;color:#f5f7fc;margin:0;padding:20px;max-width:760px;margin:auto}button{border:0;border-radius:16px;padding:16px;background:#243550;color:white;font:inherit;cursor:pointer}button:active{background:#456}h1{margin:8px 0}.muted{color:#9faec4}.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.choice{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:190px;justify-content:center}.flag{font-size:clamp(56px,14vw,105px);line-height:1.3}.name{font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{flex:1}progress{width:100%;height:16px}section{margin-top:24px}textarea{width:100%;box-sizing:border-box;background:#1b2940;color:white;border:1px solid #445;border-radius:10px;padding:12px}ol{padding-left:26px}li{margin:6px 0}.small{font-size:13px}</style></head><body><h1>Flag Arena</h1><div class="muted">196 drapeaux · 19 110 duels uniques</div><p id="count"></p><progress id="progress" max="19110" value="0"></progress><div class="arena"><button class="choice" id="left"><span class="flag" id="fl"></span><span class="name" id="nl"></span></button><button class="choice" id="right"><span class="flag" id="fr"></span><span class="name" id="nr"></span></button></div><div class="actions"><button id="tie">Égalité</button><button id="skip">Passer</button><button id="undo">Annuler</button></div><section><h2>Classement provisoire</h2><p class="muted small">Victoires + ½ égalité, classement indicatif tant que tous les duels ne sont pas joués.</p><ol id="rank"></ol></section><section><h2>Sauvegarde</h2><p class="muted small">Sauvegarde locale après chaque vote. Exporte régulièrement le JSON dans Fichiers/iCloud.</p><div class="actions"><button id="export">Exporter JSON</button><button id="import">Importer JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div></section><script>
const codes="AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI CV KH CM CA CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU MG MW MY MV ML MT MH MR MU MX FM MD MC MN ME MA MZ MM NA NR NP NL NZ NI NE NG MK NO OM PK PW PS PA PG PY PE PH PL PT QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA SS ES LK SD SR SE CH SY TJ TZ TH TL TG TO TT TN TR TM TV UG UA AE GB US UY UZ VU VA VE VN YE ZM ZW TW".split(" ");
const names=new Intl.DisplayNames(['fr'],{type:'region'});const countries=codes.map(c=>({c,n:names.of(c)||c}));const pairs=[];for(let i=0;i<codes.length;i++)for(let j=i+1;j<codes.length;j++)pairs.push([i,j]);let state;const KEY='flag-arena-196-v1';try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.votes)||state.votes.length!==pairs.length)state={votes:Array(pairs.length).fill(null),history:[],cursor:0};const flag=c=>String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0)));const el=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function next(){let i=state.cursor;while(i<pairs.length&&state.votes[i]!==null)i++;if(i===pairs.length){i=0;while(i<pairs.length&&state.votes[i]!==null)i++}state.cursor=i;return i}function render(){let done=state.votes.filter(x=>x!==null).length;el('count').textContent=done.toLocaleString('fr-FR')+' / 19 110 duels · '+(done/19110*100).toFixed(2)+' %';el('progress').value=done;let i=next();el('left').disabled=el('right').disabled=el('tie').disabled=el('skip').disabled=i>=pairs.length;if(i<pairs.length){let [a,b]=pairs[i];el('fl').textContent=flag(codes[a]);el('fr').textContent=flag(codes[b]);el('nl').textContent=countries[a].n;el('nr').textContent=countries[b].n}else{el('nl').textContent='Terminé !';el('nr').textContent='Bravo !';el('fl').textContent='🏆';el('fr').textContent='🏆'}let scores=Array(codes.length).fill(0);state.votes.forEach((v,k)=>{if(v===null||v==='skip')return;let [a,b]=pairs[k];if(v==='left')scores[a]++;else if(v==='right')scores[b]++;else if(v==='tie'){scores[a]+=.5;scores[b]+=.5}});el('rank').innerHTML=scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s||a.i-b.i).slice(0,20).map(o=>'<li>'+flag(codes[o.i])+' '+countries[o.i].n+' — '+o.s+' pt</li>').join('');save()}function vote(v){let i=next();if(i>=pairs.length)return;state.history.push([i,state.votes[i]]);state.votes[i]=v;state.cursor=i+1;render()}el('left').onclick=()=>vote('left');el('right').onclick=()=>vote('right');el('tie').onclick=()=>vote('tie');el('skip').onclick=()=>vote('skip');el('undo').onclick=()=>{let h=state.history.pop();if(h){state.votes[h[0]]=h[1];state.cursor=h[0];render()}};el('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,...state})],{type:'application/json'}));a.download='flag-arena-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};el('import').onclick=()=>el('file').click();el('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.votes)||x.votes.length!==pairs.length)throw Error('Format incompatible');if(!confirm('Remplacer les votes actuels par cette sauvegarde ?'))return;state={votes:x.votes,history:Array.isArray(x.history)?x.history:[],cursor:Number.isInteger(x.cursor)?x.cursor:0};render()}catch(e){alert('Import impossible : '+e.message)}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
